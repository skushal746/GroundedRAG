services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundedrag
      POSTGRES_PASSWORD: groundedrag
      POSTGRES_DB: groundedrag
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundedrag -d groundedrag"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundedrag:groundedrag@postgres:5432/groundedrag
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
